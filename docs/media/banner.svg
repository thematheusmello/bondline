<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
<title id="title">Bondline — chemical drawing, open to everyone</title>
<desc id="desc">Original Bondline wordmark on a deep blue background, with a mint geometric bond motif. Brand illustration, not an application screenshot.</desc>
