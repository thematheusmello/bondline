[package]
name = "bondline-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.bondline]
layer = 5

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe.workspace = true
serde_json.workspace = true
bondline-render = { path = "../render" }
bondline-commands = { path = "../commands" }
bondline-mcp = { path = "../mcp" }
bondline-model = { path = "../model" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bondline-io = { path = "../io" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Storage", "HtmlCanvasElement"] }

[dev-dependencies]
bondline-io = { path = "../io" }

[[bin]]
name = "bondline"
path = "src/main.rs"

[[example]]
name = "input_trace"
test = true

[lints]
workspace = true
