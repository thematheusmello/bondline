[package]
name = "bondline-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.bondline]
layer = 4

[dependencies]
bondline-commands = { path = "../commands" }
tokio = { version = "=1.54.1", features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "io-std", "io-util", "net", "macros", "sync"] }
getrandom = { version = "=0.3.4", features = ["std"] }
subtle = { version = "=2.6.1", default-features = false }

[lints]
workspace = true
