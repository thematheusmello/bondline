[package]
name = "bondline-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.bondline]
layer = 2

[dependencies]
bondline-model = { path = "../model" }
bondline-chem = { path = "../chem" }
bondline-cdxml = { path = "../cdxml" }
bondline-cdx = { path = "../cdx" }
roxmltree = "=0.21.2"
bondline-render = { path = "../render" }
png = "=0.18.1"
thiserror = "2"
serde.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "=0.13.0"

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", features = ["kernel"] }
windows-permissions = "=0.2.4"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
