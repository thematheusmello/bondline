[package]
name = "bondline-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
base64 = "=0.22.1"
bondline-commands = { path = "../crates/commands" }
bondline-cdxml = { path = "../crates/cdxml" }
bondline-cdx = { path = "../crates/cdx" }
bondline-io = { path = "../crates/io" }
bondline-model = { path = "../crates/model" }

[[bin]]
name = "cdxml_parse"
path = "fuzz_targets/cdxml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cdx_parse"
path = "fuzz_targets/cdx_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mol_parse"
path = "fuzz_targets/mol_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdf_parse"
path = "fuzz_targets/sdf_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mol_v3000_parse"
path = "fuzz_targets/mol_v3000_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "rxn_parse"
path = "fuzz_targets/rxn_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smiles_parse"
path = "fuzz_targets/smiles_parse.rs"
test = false
doc = false
bench = false

[[bin]]
