[package]
name = "bondline-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
bondline-cdxml = { path = "../crates/cdxml" }

[[bin]]
name = "cdxml_parse"
path = "fuzz_targets/cdxml_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
