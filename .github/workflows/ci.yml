name: Rust foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.2"
      - name: Install independent format and render consumers
        run: python -m pip install -r requirements-dev.txt
      - name: Select the pinned Rust tools
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - name: Install Linux window and GPU test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libegl1-mesa-dev libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Run the real aggregate gates
        run: cargo xtask ci
      - name: Launch the actual Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --locked -p bondline-ui --bin bondline -- --smoke-test
      - name: Launch the actual native window
        if: runner.os != 'Linux'
        run: cargo run --locked -p bondline-ui --bin bondline -- --smoke-test

  parser-fuzz:
    name: Parser ASan smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the isolated fuzz tools
        run: |
          rustup toolchain install nightly-2026-04-01 --profile minimal
          cargo install --locked cargo-fuzz --version 0.13.2 --root target/tools
          cargo +nightly-2026-04-01 fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Seed the ignored mutation corpus
        run: |
          mkdir -p .cache/fuzz/cdxml
          cp crates/cdxml/tests/fixtures/unknown.cdxml .cache/fuzz/cdxml/
          mkdir -p .cache/fuzz/cdx
          cp crates/cdx/tests/fixtures/unknown-implicit.cdx crates/cdx/tests/fixtures/original-ethane-explicit.cdx .cache/fuzz/cdx/
          mkdir -p .cache/fuzz/mol
          cp crates/io/tests/fixtures/mol/rdkit-CH3.mol crates/io/tests/fixtures/mol/ethane-v2000.mol .cache/fuzz/mol/
          mkdir -p .cache/fuzz/sdf
          cp crates/io/tests/fixtures/sdf/ordered-fields-v2000.sdf .cache/fuzz/sdf/
          mkdir -p .cache/fuzz/mol-v3000
          cp crates/io/tests/fixtures/v3000/*.mol .cache/fuzz/mol-v3000/
      - name: Run the bounded sanitizer check
        run: PATH="$PWD/target/tools/bin:$PATH" cargo +nightly-2026-04-01 fuzz run cdxml_parse .cache/fuzz/cdxml -- -runs=10000 -seed=3641879538 -max_len=65536 -timeout=5
      - name: Run the bounded binary parser sanitizer check
        run: PATH="$PWD/target/tools/bin:$PATH" cargo +nightly-2026-04-01 fuzz run cdx_parse .cache/fuzz/cdx -- -runs=10000 -seed=721533879 -max_len=131072 -timeout=5
      - name: Run the bounded MOL parser sanitizer check
        run: PATH="$PWD/target/tools/bin:$PATH" cargo +nightly-2026-04-01 fuzz run --sanitizer address mol_parse .cache/fuzz/mol -- -runs=10000 -seed=619734821 -max_len=65536 -timeout=5
      - name: Run the bounded SDF parser sanitizer check
        run: PATH="$PWD/target/tools/bin:$PATH" cargo +nightly-2026-04-01 fuzz run --sanitizer address sdf_parse .cache/fuzz/sdf -- -runs=10000 -seed=826403517 -max_len=65536 -timeout=5
      - name: Run the bounded V3000 parser sanitizer check
        run: PATH="$PWD/target/tools/bin:$PATH" cargo +nightly-2026-04-01 fuzz run --sanitizer address mol_v3000_parse .cache/fuzz/mol-v3000 -- -runs=10000 -seed=937155923 -max_len=65536 -timeout=5
      - name: Check dependency pins were retained
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
