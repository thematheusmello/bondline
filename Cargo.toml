[workspace]
members = ["crates/ui", "crates/render", "compat/hexf-parse", "compat/libloading", "compat/clipboard-win", "xtask"]
resolver = "3"
exclude = ["vendor/eframe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spdx = "=0.13.6"
eframe = { version = "=0.29.1", default-features = false, features = ["wgpu", "accesskit", "x11", "wayland"] }
wgpu = { version = "=22.1.0", default-features = false, features = ["wgsl", "metal", "dx12"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 1
debug = false

[patch.crates-io]
eframe = { path = "vendor/eframe" }
hexf-parse = { path = "compat/hexf-parse" }
libloading = { path = "compat/libloading" }
clipboard-win = { path = "compat/clipboard-win" }
