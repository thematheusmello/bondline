[package]
name = "clipboard-win"
version = "5.4.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Independently implemented Windows clipboard API surface for pinned Arboard"

[features]
std = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
