[package]
name = "libloading"
version = "0.8.9"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Bondline compatibility surface over MIT-licensed dlopen2, not upstream libloading"

[dependencies]
dlopen2 = { version = "=0.9.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
